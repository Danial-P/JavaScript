<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <p>Cart Quantity</p>
  <button onclick="
  ">Show Quantity</button>
  <button onclick="
  updateCartQuantity(1);
  ">Add to Cart</button>
  <button onclick="
  updateCartQuantity(2);
  ">+2</button>
  <button onclick="
  updateCartQuantity(3);
  ">+3</button>
  <button onclick="
  updateCartQuantity(4);
  ">+4</button>
  <button onclick="
  updateCartQuantity(5);
  ">+5</button>
  <button onclick="
    resetCartQuantity('Cart Reset.')
  
  ">Reset Cart</button>
  <button onclick="
    updateCartQuantity(-1);
  ">Remove from cart</button>
  <button onclick="
    updateCartQuantity(-2);
  ">-2</button>
  <button onclick="
    updateCartQuantity(-3);
  ">-3</button>
  <p class="js-resetCartQuantity"></p>
  <p class="js-quantity"></p>


  <script>
    let cartQuantity = JSON.parse(localStorage.
      getItem('cartQuantity')) || 0

    cartQuantityInPage()

    function updateCartQuantity(value) {
      if (cartQuantity + value > 10) {
        alert(`The cart is full.`)
        return;
      }
       if (cartQuantity + value < 0) {
        alert(`Not enough item in the cart.`)
        return;
      }
        cartQuantity += value
        localStorage.setItem('cartQuantity', JSON.
          stringify(cartQuantity))
          cartQuantityInPage()  
          resetCartQuantity('')

    }
    function cartQuantityInPage() {
      document.querySelector('.js-quantity').
        innerHTML = `Cart Quantity: ${cartQuantity}`
    }
    function resetCartQuantity(resetValue) {
      if (resetValue === '') {
        document.querySelector('.js-resetCartQuantity'). 
          innerHTML = resetValue
      } else {
      cartQuantity = 0
      localStorage.removeItem('cartQuantity')
      document.querySelector('.js-resetCartQuantity').
        innerHTML = resetValue
      cartQuantityInPage()  
      }
    }

  </script>

</body>
</html>
