<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>updateCalculator</title>
</head>

<body>

  // My code
  <p>
    <button onclick="
    console.log(calculation('1'));
    ">1</button>
    <button onclick="
    console.log(calculation('2'));
    ">2</button>
    <button onclick="
    console.log(calculation('3'));
    ">3</button>
    <button onclick="
       console.log(calculation(' + '));
    ">+</button>
  </p>
  <p>
    <button onclick="
    console.log(calculation('4'));
    ">4</button>
    <button onclick="
    console.log(calculation('5'));
    ">5</button>
    <button onclick="
    console.log(calculation('6'));
    ">6</button>
    <button onclick="
       console.log(calculation(' - '));
    ">-</button>
  </p>
  <p>
    <button onclick="
    console.log(calculation('7'));
    ">7</button>
    <button onclick="
    console.log(calculation('8'));
    ">8</button>
    <button onclick="
    console.log(calculation('9'));
    ">9</button>
    <button onclick="
       console.log(calculation(' * '));
    ">*</button>
  </p>
  <p>
    <button onclick="
    console.log(calculation('0'));
    ">0</button>
    <button onclick="
    console.log(calculation('.'));
    ">.</button>
    <button onclick="
    console.log(calculation('='));
    ">=</button>
    <button onclick="
       console.log(calculation(' / '));
    ">/</button>
  </p>
  <button onclick="
    console.log(calculation('clear'));
  ">Clear</button>

  <script>
    let calculationBtn = ''

    function calculation(BTN) {
      if (BTN === '=') {
        return calculationBtn = eval(calculationBtn)
      } else if (BTN === 'clear') {
        calculationBtn = ''
        return 'cleared'
      }
      else {
        return calculationBtn += BTN
      }
    }
  </script>

</body>

</html>
