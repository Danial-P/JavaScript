  <p>
    <button onclick="
      updateCalculation('1');
    ">1</button>

    <button onclick="
      updateCalculation('2');
    ">2</button>

    <button onclick="
      updateCalculation('3');
    ">3</button>

    <button onclick="

    <button onclick="
      calculation = eval(calculation);
      console.log(calculation);
      saveCalculation()
    ">=</button>

      updateCalculation(' / ');
    ">/</button>

  <p>
    <button onclick="
      calculation = '';
      console.log(calculation);
    ">Clear</button>
  </p>

  <script>
    let calculation = localStorage.getItem('calculation') || '';
    localStorage.getItem(calculation)

    function updateCalculation(value) {
      calculation += value;
      saveCalculation()
      console.log(calculation);
    }
    function saveCalculation() {
      localStorage.setItem('calculation', calculation)
    }
  </script>
