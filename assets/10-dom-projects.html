<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Projects</title>
  <style>
    .subscribe-button {
      border: none;
      background-color: black;
      border-radius: 25px;
      color: white;
      padding: 10px 15px 10px 15px;
      font-weight: 700;
      cursor: pointer;
      margin: 0 0 35px 0;
    }
    .is-subscribed {
      background-color: rgb(240, 240, 240);
      color: black;
    }
    .cost-input {
      font-size: 15px;
      padding: 10px;
      cursor: text;
    }
    .calculate-button {
      background-color: green;
      color: white;
      font-size: 15px;
      padding: 12px 15px;
      border: none;
      cursor: pointer;
    }




    body {
      font-family: Arial;
    }
  </style>
</head>
<body>

  
  <p>YouTube Subscribe Button</p>
  <button
   class="js-subscribe subscribe-button"
   onclick="subscribe()
   ">
   Subscribe    </button>


  <p>Amazon Shipping Calculator</p>
  <input class="js-cost-input cost-input" type="number" placeholder="Cost of order" onkeydown="
    handleCostKeydown(event)
  ">
  <button class="calculate-button" onclick="
    calculateTotal()
  ">Calculate</button>
  <p class="js-total"></p>

  <script>
    String(25)
    console.log('25 - 5');
    console.log('25' + 5);
    

    
    function subscribe() {
      const buttonElement = document.querySelector('.js-subscribe')

      if (buttonElement.innerText === 'Subscribe') {
        buttonElement.innerHTML = 'Subscribed'
        buttonElement.classList.add('is-subscribed')
      } else {
        buttonElement.innerHTML = 'Subscribe'
        buttonElement.classList.remove('is-subscribed')
      }
    }
    

    function handleCostKeydown(event) {
      if (event.key === 'Enter') {
        calculateTotal() 
      }
    }
    function calculateTotal() {
      const inputElement = document.querySelector
        ('.js-cost-input')
      let cost = Number(inputElement.value); 
      
      if (cost < 40) {
        cost += 10 
      }
      document.querySelector('.js-total').
        innerHTML = `Your Total Cost: $${cost}`
    }
  </script>
</body>
</html>
