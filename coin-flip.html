<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>coon flip</title>
</head>

<body>

  <button onclick="
    playGame('heads');
    ">heads</button>
  <button onclick="
    playGame('tails');
    
  ">tails</button>
  <script>
    

    function pickComputerMove() {
      const randomNumber = Math.random()
      let computerMove = ''
      if (randomNumber < 1 / 2) {
        computerMove = 'heads'
      } else {
        computerMove = 'tails'
      }
      return computerMove;
    }

    function playGame(guess) {
      const score = {
        wins: 0,
        losses: 0
      };
      
      const computerMove = pickComputerMove()

      if (guess === computerMove) {
        score.wins += 1
        console.log('You win');
      } else {
        score.losses += 1
        console.log('You losses');
      }

    }

      const result = randomNumber < 0.5 ? 'heads' : 'tails';

      console.log(guess === result ? 'You win!' : 'You lose!');
    }
    */
    

  </script>
</body>

</html>
