<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>coon flip</title>
</head>

<body>

  <button onclick="
    playGame('heads');
    ">heads</button>
  <button onclick="
    playGame('tails');
    
  ">tails</button>
  <p class="js-moves"></p>
  <p class="js-result"></p>
  <p class="js-score"></p>
  <button onclick="
    resetScore()
  ">Reset</button>
  <button onclick="
    console.log(score);
    
  ">score</button>
  <script>
    let score = JSON.parse(localStorage.getItem('score')) || {
      wins: 0,
      losses: 0
    }

    updateScoreElement()

    function playGame(guess) {
      const randomNumber = Math.random()
      let computerMove = ''
      let result = ''

      if (randomNumber < 0.5) {
        computerMove = 'heads'
      } else {
        computerMove = 'tails'
      }

      if (guess === computerMove) {
        result = 'You win.'
        score.wins += 1
      } else {
        result = 'You lose.'
        score.losses += 1
      }
      
      localStorage.setItem('score', (JSON.stringify(score)));
      updateScoreElement()

      document.querySelector('.js-moves').
        innerHTML = `You picked ${guess}, Computer picked ${computerMove}`
      document.querySelector('.js-result').
        innerHTML = `${result}`


    }
    function updateScoreElement() {
      document.querySelector('.js-score').
        innerHTML = `Wins: ${score.wins} Losses: ${score.losses}` 
    }
    function resetScore() {
      score = {
      wins: 0,
      losses: 0
    }
    localStorage.removeItem('score')

    updateScoreElement()
    document.querySelector('.js-result').
        innerHTML = ''
    document.querySelector('.js-moves').
        innerHTML = ''
    }
    

  </script>
</body>

</html>
