<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>coon flip</title>
</head>

<body>

  <button onclick="
    playGame('heads');
    ">heads</button>
  <button onclick="
    playGame('tails');
    
  ">tails</button>
  <button onclick="
    score = {
      wins: 0,
      losses: 0
    }
    localStorage.removeItem('score')
  ">Reset</button>
  <script>
    let score = JSON.parse(localStorage.getItem('score')) || {
      wins: 0,
      losses: 0
    }

    function playGame(guess) {
      const randomNumber = Math.random()
      const result = randomNumber < 0.5 ? 'head' : 'tails'
      console.log(guess === result ? 'You win' : 'You lose');
      if (guess === result) {
        score.wins += 1
      } else {
        score.losses += 1
      }
      
      console.log(score);
      localStorage.setItem('score', (JSON.stringify(score)));
    }

      const result = randomNumber < 0.5 ? 'heads' : 'tails';

      console.log(guess === result ? 'You win!' : 'You lose!');
    }
    */
    

  </script>
</body>

</html>
